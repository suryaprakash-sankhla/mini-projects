<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="clock">
      <div>
        <span class="hr">00</span>:<span class="min">00</span>:<span class="sec"
          >00</span
        ><span class="msec">.00</span>
      </div>
      <div class="btns">
        <button class="stop btn">Stop</button
        ><button class="res btn">Restart</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
