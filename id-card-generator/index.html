<!DOCTYPE html>
<html>
  <head>
    <title>Id Card Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
      <div id="display">
        <div id="card">
          <div id="idcard">
            <img id="iimage" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png">
            <ul>
              <li id="iname">Name:</li>
              <li id="iage">Age:</li>
              <li id="imail">Email Id:</li>
              <ul>
          </div>
        </div>
    <div id="main" >
   <form>
      <input id="name" type="text" placeholder="Name">
      <input id="age" type="text" placeholder="Age">
      <input id="mail" type="text" placeholder="Email">
      <input id="image"type="file" accept=".png,.jpg, .jpeg" placeholder="Profile-pic">
      <input id="btn" type="submit">
   </form>
  </div>
  </div>
    <script src="script.js"></script>
  </body>
</html>
